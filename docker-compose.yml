version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: biblioteca-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - biblioteca-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: biblioteca-web
    restart: unless-stopped
    command: uv run manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - biblioteca-network

networks:
  biblioteca-network:
    driver: bridge

volumes:
  postgres_data:
