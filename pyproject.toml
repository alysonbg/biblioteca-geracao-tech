[project]
name = "biblioteca-geracao-tech"
version = "0.1.0"
description = "Sistema de gerenciamento de biblioteca"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "django-ninja>=1.8.0",
    "django-ninja-simple-jwt>=0.8.1",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "flake8>=7.5.0",
]
